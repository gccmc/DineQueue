<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叫号大屏</title>
    <link rel="stylesheet" href="display-style.css">
</head>
<body>
    <div class="display-app">
        <header class="display-header">
            <div class="brand">🎫 请留意您的号码</div>
            <div class="clock" id="clock"></div>
        </header>

        <main class="display-body">
            <!-- 当前叫号 -->
            <section class="hero" id="hero">
                <div class="hero-label">正在呼叫</div>
                <div class="hero-number" id="hero-number">——</div>
                <div class="hero-sub" id="hero-sub">请到服务台</div>
                <div class="hero-active" id="hero-active"></div>
            </section>

            <!-- 下一位 -->
            <section class="next-section">
                <div class="next-label">下一位</div>
                <div class="next-grid" id="next-grid">
                    <div class="next-empty">暂无</div>
                </div>
            </section>

            <!-- 待叫队列 -->
            <section class="queue">
                <div class="queue-head">
                    <span class="queue-title">待叫队列</span>
                    <span class="queue-stat" id="queue-stat">共 0 位</span>
                </div>
                <div class="queue-grid" id="queue-grid">
                    <div class="queue-empty">暂无等待</div>
                </div>
            </section>
        </main>

        <footer class="display-footer">请凭号码牌入座 · 谢谢配合</footer>
    </div>

    <script src="display.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</body>
</html>
