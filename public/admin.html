<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 · 叫号系统</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <header class="admin-header">
        <h1>🎫 后台管理</h1>
        <div class="admin-header-right">
            <a class="nav-link" href="/display.html" target="_blank">叫号大屏</a>
            <a class="nav-link" href="/index.html" target="_blank">预约平台</a>
            <a class="nav-link" href="/kiosk.html" target="_blank">自助取号机</a>
        </div>
    </header>

    <main class="admin-main">

        <!-- 叫号控制 -->
        <section class="control-panel">
            <div class="control-title">叫号控制</div>
            <div class="control-row">
                <button class="btn-call" onclick="autoCallNext()">🔊 叫下一号</button>
                <div class="table-assign">
                    <label>手动分配桌号（可留空=自动/不分配）</label>
                    <input type="text" id="call-table-input" placeholder="例如 3号桌 / 扶手清香料" list="table-list">
                </div>
            </div>
            <div class="control-row tables-config">
                <div>
                    <label>桌号列表（用逗号分隔）</label>
                    <input type="text" id="tables-input" placeholder="1号桌,2号桌,3号桌…">
                </div>
                <label class="switch-wrap">
                    <input type="checkbox" id="autoTable-check"> 叫号时自动分配空闲桌
                </label>
                <button class="btn-ghost-sm" onclick="saveSettings()">保存桌号配置</button>
            </div>
        </section>

        <!-- 当前被叫 -->
        <section class="now-calling" id="now-calling">
            <div class="now-label">正在呼叫</div>
            <div class="now-name" id="now-number">—</div>
            <div class="now-table" id="now-table"></div>
        </section>

        <!-- 队列列表 -->
        <section class="queue-section">
            <div class="queue-title">今日队列 <span id="queue-count" class="badge"></span></div>
            <div id="queue-list" class="queue-list"></div>
            <div id="queue-empty" class="queue-empty">今日暂无排队号码</div>
        </section>

    </main>

    <div id="toast" class="toast"></div>
    <script src="admin.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</body>
</html>
